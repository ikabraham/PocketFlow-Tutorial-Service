server {
    listen 80;
    server_name _;

    # --- Public: static markdown, via Cloudflare -----------------------------
    location /tutorials/ {
        alias /srv/tutorials/;
        autoindex off;

        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header X-Content-Type-Options "nosniff" always;

        location ~* /tutorials/.+\.(php|py|sh|cgi|pl|rb|js|html?)$ {
            deny all;
        }
    }

    # --- Private: the API, VPC only ------------------------------------------
    location /api/ {
        allow 172.31.0.0/16;
        allow 127.0.0.1;
        deny  all;

        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        allow 172.31.0.0/16;
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://api:8000/healthz;
    }

    location / {
        return 404;
    }
}
