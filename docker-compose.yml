services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - output:/app/output
      - data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    # No host port. Only nginx reaches it, over the internal network.

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "worker.py"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - output:/app/output
      - data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - output:/srv/tutorials:ro     # read-only: nginx can never write
    depends_on:
      - api

volumes:
  output:
  data:
  redis:
